<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in · MetaStar Directory Server</title>
    <link rel="stylesheet" href="../register/register.css">
    <link rel="stylesheet" href="../brand.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <a class="brand" href="../login/" aria-label="MetaStar Directory Server"><img class="brand-logo" src="../logo.php" alt="MetaStar"><span class="brand-subtitle">DIRECTORY SERVER</span></a>
            <div class="eyebrow">WELCOME BACK</div>
            <h1 id="page-title">Sign in</h1>
            <p class="intro">Sign in to your account for this metaverse.</p>

            <div id="login-message" class="message" role="status" aria-live="polite" hidden></div>

            <form id="login-form">
                <label for="login">Username or email</label>
                <input id="login" name="login" type="text" autocomplete="username" autocapitalize="none" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button id="submit-button" type="submit">Sign in</button>
            </form>

            <details class="resend-panel">
                <summary>Didn't receive a verification email?</summary>
                <form id="resend-form">
                    <label for="resend-email">Email address</label>
                    <input id="resend-email" name="email" type="email" autocomplete="email" required>
                    <button id="resend-button" type="submit">Request another email</button>
                    <div id="resend-message" class="message" role="status" aria-live="polite" hidden></div>
                </form>
            </details>

            <p id="register-link" class="auth-switch">New here? <a href="../register/">Create an account</a></p>
        </section>
        <footer>Powered by MetaStar · Independent metaverse infrastructure</footer>
    </main>
    <script src="login.js" defer></script>
</body>
</html>
