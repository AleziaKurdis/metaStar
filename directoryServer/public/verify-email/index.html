<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Email verification · Overte</title>
    <link rel="stylesheet" href="../register/register.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <a class="brand" href="../login/" aria-label="Overte account sign in">
                <span class="brand-mark">O</span>
                <span><strong>OVERTE</strong><small>DIRECTORY SERVER</small></span>
            </a>
            <div class="eyebrow">ACCOUNT VERIFICATION</div>
            <h1 id="page-title">Email verification</h1>
            <div id="verification-message" class="message" role="status" aria-live="polite">Checking verification status…</div>
            <p class="auth-switch"><a href="../login/">Go to sign in</a></p>
        </section>
        <footer>Powered by Overte · Open-source social VR</footer>
    </main>
    <script src="verify-email.js" defer></script>
</body>
</html>
